<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 20 340 350" width="340" height="350">
  <!-- Hero version 5 from the FigJam board, side view facing right. Feet stand on y=352.
       Each part has an id so the engine can cut it into separately tinted, separately moving pieces.
       Colours here are the "lit" state. Dark state: base #2e3345, back #262b3b, cape #272c3c, eye #cfd6e6, blade #4a5166, petal #8f9bbd. -->
  <path id="cape" d="M200 200 C176 202 160 226 152 266 C146 300 128 330 96 346 Q86 351 100 352 Q118 358 136 352 Q154 346 170 352 Q180 355 190 352 C186 328 188 300 190 280 L192 208 Z" fill="#5c6379"/>
  <g id="leg-back">
    <path d="M200 278 L186 340" stroke="#565d73" stroke-width="17" stroke-linecap="round" fill="none"/>
    <path d="M176 340 h22 q12 2 14 12 h-38 z" fill="#565d73"/>
  </g>
  <g id="leg-front">
    <path d="M208 278 L226 340" stroke="#6b7388" stroke-width="17" stroke-linecap="round" fill="none"/>
    <path d="M216 340 h22 q14 2 16 12 h-40 z" fill="#6b7388"/>
  </g>
  <path id="body" d="M190 204 Q206 198 220 206 L226 280 Q206 290 186 280 Z" fill="#6b7388"/>
  <g id="sword" transform="translate(238 264) rotate(-20)">
    <rect x="-14" y="-4" width="26" height="8" rx="3" fill="#565d73"/>
    <rect x="10" y="-15" width="7" height="30" rx="3" fill="#565d73"/>
    <path d="M17 -7 L98 -7 L114 0 L98 7 L17 7 Z" fill="#dfe5f3"/>
  </g>
  <g id="arm">
    <path d="M206 216 Q226 236 236 260" stroke="#6b7388" stroke-width="14" stroke-linecap="round" fill="none"/>
    <circle cx="238" cy="264" r="10" fill="#6b7388"/>
  </g>
  <g id="flower">
    <path id="flower-stem" d="M198 92 Q194 74 206 60" stroke="#565d73" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path id="flower-leaf" d="M197 80 q-16 -8 -20 4 q12 6 20 -4 z" fill="#565d73"/>
    <g id="flower-petals" fill="#f2f4fa">
      <circle id="petal-1" cx="208" cy="40" r="9"/>
      <circle id="petal-2" cx="221" cy="50" r="9"/>
      <circle id="petal-3" cx="216" cy="65" r="9"/>
      <circle id="petal-4" cx="200" cy="65" r="9"/>
      <circle id="petal-5" cx="195" cy="50" r="9"/>
    </g>
    <circle id="flower-centre" cx="208" cy="54" r="7" fill="#6b7388"/>
  </g>
  <circle id="head" cx="200" cy="146" r="58" fill="#6b7388"/>
  <!-- Eye states. calm: this ellipse. hidden: rx 9 ry 4 at cy 154. playful: an upward arc. -->
  <ellipse id="eye" cx="236" cy="152" rx="8" ry="13" fill="#ffffff"/>
  <!-- Closed flower (hidden state): replace #flower-petals and #flower-centre with
       <ellipse cx="206" cy="54" rx="7" ry="13"/> and the stem "M198 92 Q196 78 204 66". -->
</svg>
