<!doctype html>
<!--
  The locked frame a "trick" runs in. A trick is a small script written by an AI for one wish.
  It is untrusted. This page is loaded in an iframe with sandbox="allow-scripts" and nothing else,
  so it has no origin: no cookies, no storage, no access to the page around it.
  The policy below also takes away the network: nothing can be fetched or sent from here.
  The script itself does not even run on this page. It runs in a worker that this page starts and
  can stop at any moment, and it only ever sees the small "game" object described in
  src/trick/reference.ts. This page draws what the worker reports and passes on the player's input.
  It talks to the app outside only by messages.
-->

    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' blob:; worker-src blob:; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <style>
      html, body { margin: 0; height: 100%; background: #070a14; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    </style>
  </head>

var W = 800, H = 400, GROUND = 330, MAX_SPRITES = 300;
var VEHICLES = ['bike', 'car', 'ship', 'wings'];
var MONSTERS = ['crawler', 'flyer', 'thorn', 'stalker', 'watcher'];
var PETALS = ['#f2f4fa', 'accent', 'light', '#ff9db0', '#a8e6cf'];

// A monster's kind: one of the five, two of them joined with a plus sign, or "boss".
function monsterKind(kind) {
  if (kind === 'boss') return 'boss';
  var parts = String(kind).split('+');
  if (parts.length === 2 && parts[0] !== parts[1] && MONSTERS.indexOf(parts[0]) >= 0 && MONSTERS.indexOf(parts[1]) >= 0) return parts.sort().join('+');
  return MONSTERS.indexOf(kind) >= 0 ? kind : 'crawler';
}

function boot(trick, seed) {
  var sprites = [];
  var updates = [];
  var sounds = [];
  var state = { over: null, text: '', camera: 0, time: 0, scene: 'road', dark: 0 };
  var input = { left: false, right: false, up: false, down: false, action: false, held: false, x: 0, y: 0 };
  var s0 = (seed >>> 0) || 1;
  function random() {
    s0 = (s0 + 0x6d2b79f5) >>> 0;
    var t = s0;
    t = Math.imul(t ^ (t >>> 15), t | 1);

      shape: o.shape === 'circle' || o.shape === 'tri' || o.shape === 'flower' ? o.shape : 'box',
      x: num(o.x, 0), y: num(o.y, 0), w: num(o.w, 20), h: num(o.h, 20),
      vx: num(o.vx, 0), vy: num(o.vy, 0), gravity: num(o.gravity, 0),
      color: typeof o.color === 'string' ? o.color : 'hero',
      tag: typeof o.tag === 'string' ? o.tag : '',

    };
    s.remove = function () { s.alive = false; };

    return s;
  }

  function special(shape, o, w, h, tag) {
    o = o || {};
    var s = add({ x: o.x, y: o.y, w: num(o.w, w), h: num(o.h, h), vx: o.vx, vy: o.vy, gravity: o.gravity, tag: typeof o.tag === 'string' ? o.tag : tag, fixed: o.fixed });

    s.face = o.face === -1 ? -1 : 1;

  }

    width: W, height: H, ground: GROUND,
    score: 0, lives: 3,
    input: input,
    add: add,
    hero: function (o) {

      var s = special('hero', o, 44, 84, 'hero');
      s.kind = VEHICLES.indexOf(o.vehicle) >= 0 ? o.vehicle : '';
      if (s.kind === 'car' && !o.w) { s.w = 84; s.h = 52; }
      if (s.kind === 'bike' && !o.w) { s.w = 60; s.h = 60; }
      if (s.kind === 'ship' && !o.w) { s.w = 60; s.h = 40; }
      if (s.kind === 'wings' && !o.w) { s.w = 70; s.h = 56; }
      return s;
    },
    monster: function (o) {
      o = o || {};
      var s = special('monster', o, 44, 40, 'monster');
      s.kind = monsterKind(o.kind);
      // A merge of two kinds ("crawler+flyer"), or the boss: larger than the five.
      if (s.kind === 'boss' && !o.h) { s.w = 110; s.h = 210; }

    setInput: function (i) { for (var k in input) if (k in i) input[k] = i[k]; },
    step: function (dt) {
      if (state.over) return;
      state.time += dt;
      for (var u = 0; u < updates.length; u++) updates[u](dt);
      for (var i = 0; i < sprites.length; i++) {
        var s = sprites[i];

        s.x = num(s.x, 0) + num(s.vx, 0) * dt;

// One pretend play-through, as fast as it will go. `scripted` false means nobody touches anything.
function playThrough(trick, seed, frames, scripted) {
  var rt;
  try { rt = boot(trick, seed); } catch (e) { return { ok: false, message: 'It broke while starting: ' + (e && e.message ? e.message : e) }; }
  var first = '', last = '', seen = 0, changed = false, score0 = null, lives0 = null, moved = false, over = null, overAt = -1;
  for (var f = 0; f < frames; f++) {
    var beat = Math.floor(f / 45) % 4;
    if (scripted) rt.setInput({ left: beat === 2, right: beat === 0 || beat === 1, up: f % 70 === 30, down: f % 110 === 80, action: f % 25 === 10, held: beat !== 3, x: 200 + (f * 3) % 400, y: 120 + (f * 2) % 200 });
    try { rt.step(1 / 60); } catch (e) { return { ok: false, message: 'It broke while running: ' + (e && e.message ? e.message : e) }; }
    var frame = rt.frame();
    last = JSON.stringify(frame.sprites);

    if (frame.score !== score0 || frame.lives !== lives0) moved = true;

}

// The test before anyone plays. First: does it run at all? Then: is there a game in it?
// It passes when nothing throws, something is on screen, the game does not end by itself in
// the first two seconds, what the player does changes something, and something can be
// scored, won or lost.
function simulate(trick, seed) {
  var played = playThrough(trick, seed, 360, true);
  if (!played.ok) return played;
  if (played.over && played.overAt < 120) return { ok: false, message: 'The game ended by itself after ' + (played.overAt / 60).toFixed(1) + ' seconds (' + played.over + '). It must last at least a few seconds.' };
  if (played.seen === 0) return { ok: false, message: 'Nothing was drawn. Use game.add or game.hero to put things on screen.' };
  if (!played.changed) return { ok: false, message: 'Nothing moved or changed in six seconds, with every input tried. Use game.onUpdate and game.input.' };
  var idle = playThrough(trick, seed, 360, false);
  if (idle.ok && idle.last === played.last && idle.over === played.over) return { ok: false, message: 'What the player does changes nothing: the screen is the same with input and without. Read game.input in game.onUpdate and move the player with it.' };
  var long = playThrough(trick, seed, 2400, true);
  if (!long.ok) return long;
  if (!long.moved && !long.over) return { ok: false, message: 'In forty seconds of play nothing was scored, no life was lost and the game was neither won nor lost. Make sure things can really reach the player, and that hits, pickups and the goal are checked with game.hits.' };
  return { ok: true, message: '' };
}

            over = false; paused = true; playing = true;
            requestAnimationFrame(loop);
          }
        });
        tell({ type: 'ready' });
      })();
    </script>
  </body>
</html>
